<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="Play Pham Son Tung's interactive portfolio and Slot Machine game.">
  <title>Who's that developer? | Portfolio</title>
  <link rel="icon" href="Portfolio/TemplateData/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="montserrat-font" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #171717; --paper: #f7f5ee; --accent: #ffe24b; --pink: #ff8dc7; --shadow: 5px 5px 0 var(--ink); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: 'Montserrat', sans-serif; }
    button { color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #3157ff; outline-offset: 5px; }
    .workspace { min-height: 100vh; min-height: 100dvh; padding: 24px 28px 16px; display: flex; flex-direction: column; gap: 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; border: 3px solid; background: var(--accent); box-shadow: 3px 3px 0 var(--ink); font-size: 32px; font-weight: 900; transform: rotate(-5deg); }
    h1 { margin: 0; font-size: clamp(18px, 2vw, 26px); font-weight: 900; letter-spacing: -1px; }
    .tabs { display: flex; gap: 12px; }
    .tab { min-height: 48px; padding: 10px 20px; border: 3px solid; background: white; box-shadow: var(--shadow); font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 14px; }
    .tab small { font-size: 13px; }
    .tab:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
    .tab[aria-selected="true"] { background: var(--accent); transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    #tab-slotmachine[aria-selected="true"] { background: var(--pink); }
    .player-panel { flex: 1; min-height: 360px; display: flex; flex-direction: column; border: 3px solid; background: white; box-shadow: 7px 7px 0 var(--ink); }
    .panel-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 3px solid; background: var(--accent); }
    body[data-game="slotmachine"] { --accent: var(--pink); }
    .panel-heading { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; }
    .dot { width: 10px; height: 10px; border: 2px solid; background: white; }
    .fullscreen { display: flex; align-items: center; gap: 8px; border: 2px solid; padding: 7px 10px; background: white; box-shadow: 2px 2px 0; font-size: 14px; font-weight: 700; }
    .fullscreen:active { transform: translate(2px, 2px); box-shadow: none; }
    .fullscreen svg { width: 16px; height: 16px; }
    .player-space { position: relative; flex: 1; min-height: 300px; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .footer { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; }
    .footer span:last-child { text-align: right; }
    .workspace:fullscreen { background: var(--paper); }
    @media (max-width: 680px) {
      .workspace { padding: 16px 16px 12px; gap: 18px; }
      .header { gap: 18px; }
      .brand-mark { width: 38px; height: 38px; font-size: 26px; }
      .tabs { width: 100%; }
      .tab { flex: 1; justify-content: center; padding: 10px 8px; gap: 8px; font-size: 14px; }
      .panel-bar { padding: 10px; gap: 8px; }
      .panel-heading { font-size: 13px; }
      .fullscreen { font-size: 13px; }
      .footer { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body data-game="portfolio">
  <div class="workspace" id="workspace">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">?</span><h1>Who's that developer?</h1></div>
      <nav class="tabs" role="tablist" aria-label="Choose an experience">
        <button class="tab" id="tab-portfolio" type="button" role="tab" aria-selected="true" aria-controls="player-panel" data-game="portfolio"><small aria-hidden="true">01</small> Portfolio</button>
        <button class="tab" id="tab-slotmachine" type="button" role="tab" aria-selected="false" aria-controls="player-panel" tabindex="-1" data-game="slotmachine"><small aria-hidden="true">02</small> Slot Machine</button>
      </nav>
    </header>
    <main class="player-panel" id="player-panel" role="tabpanel" aria-labelledby="tab-portfolio">
      <div class="panel-bar">
        <div class="panel-heading"><span class="dot" aria-hidden="true"></span><span id="experience-label">PORTFOLIO / PLAYABLE</span></div>
        <button class="fullscreen" id="fullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span id="fullscreen-label">Fullscreen</span>
        </button>
      </div>
      <div class="player-space" id="player-space"></div>
    </main>
    <footer class="footer"><span>PHAM SON TUNG &copy; <span id="year"></span></span><span id="experience-note">Explore the interactive portfolio.</span></footer>
    <noscript>Please enable JavaScript to play the portfolio or Slot Machine.</noscript>
  </div>
  <script>
    // Each build runs in its own document. Replacing the iframe releases the
    // previous Unity runtime and prevents loader/global conflicts between builds.
    function runPlayer(game) {
      const builds = {
        portfolio: { folder: 'Portfolio', file: 'Portfolio-Build', name: 'Portfolio', width: 1920, height: 1080 },
        slotmachine: { folder: 'SlotMachine', file: 'SlotMachine', name: 'Slot Machine', width: 960, height: 600 }
      };
      const build = builds[game];
      const assetUrl = path => new URL(build.folder + '/' + path, document.baseURI).href;
      const canvas = document.getElementById('unity-canvas');
      const loading = document.getElementById('loading');
      const percent = document.getElementById('percent');
      const progress = document.getElementById('progress');
      const label = document.getElementById('loading-label');
      const title = document.getElementById('loading-title');
      const warning = document.getElementById('warning');
      canvas.width = build.width;
      canvas.height = build.height;
      title.textContent = build.name;
      canvas.setAttribute('aria-label', build.name + ' interactive player');

      function fitCanvas() {
        const scale = Math.min(window.innerWidth / build.width, window.innerHeight / build.height);
        canvas.style.width = Math.floor(build.width * scale) + 'px';
        canvas.style.height = Math.floor(build.height * scale) + 'px';
      }
      window.addEventListener('resize', fitCanvas);
      fitCanvas();

      let failed = false;
      function fail(message) {
        if (failed) return;
        failed = true;
        loading.hidden = false;
        title.textContent = 'Could not load ' + build.name;
        label.textContent = String(message || 'Please check your connection and try again.');
        progress.hidden = true;
        percent.hidden = true;
        document.getElementById('retry').hidden = false;
      }
      document.getElementById('retry').onclick = () => window.parent.postMessage({ type: 'retry-player' }, window.location.origin);
      const config = {
        arguments: [],
        dataUrl: assetUrl('Build/' + build.file + '.data'),
        frameworkUrl: assetUrl('Build/' + build.file + '.framework.js'),
        codeUrl: assetUrl('Build/' + build.file + '.wasm'),
        streamingAssetsUrl: assetUrl('StreamingAssets'),
        companyName: 'DefaultCompany',
        productName: game === 'portfolio' ? 'Portfolio' : 'SlotMachine',
        productVersion: '1.0',
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
        showBanner: (message, type) => {
          if (type === 'error') { fail(message); return; }
          const item = document.createElement('div');
          item.textContent = message;
          warning.appendChild(item);
          window.setTimeout(() => item.remove(), 5000);
        }
      };
      const script = document.createElement('script');
      script.src = assetUrl('Build/' + build.file + '.loader.js');
      script.onerror = () => fail('The player could not be downloaded. Please try again.');
      script.onload = async () => {
        try {
          await createUnityInstance(canvas, config, value => {
            if (failed) return;
            const pct = Math.round(value * 100);
            progress.value = pct;
            percent.textContent = pct + '%';
            label.textContent = pct > 90 ? 'Almost ready...' : 'Loading ' + build.name + '...';
          });
          if (!failed) { loading.hidden = true; canvas.focus({ preventScroll: true }); }
        } catch (error) { fail(error); }
      };
      document.body.appendChild(script);
    }

    const playerStyles = `
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #171717; background: #202020; font-family: 'Montserrat', sans-serif; display: grid; place-items: center; }
      canvas { display: block; background: #202020; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; padding: 22px; overflow: auto; background-color: #f7f5ee; background-image: linear-gradient(#17171712 1px, transparent 1px), linear-gradient(90deg, #17171712 1px, transparent 1px); background-size: 32px 32px; }
      #loading[hidden], [hidden] { display: none !important; }
      .card { width: min(400px, 100%); border: 3px solid; background: white; padding: 28px; box-shadow: 8px 8px 0 #171717; }
      .sticker { width: 72px; height: 72px; display: grid; place-items: center; background: var(--accent); border: 3px solid; box-shadow: 4px 4px 0; font-size: 48px; font-weight: 900; transform: rotate(-6deg); margin-bottom: 28px; }
      h2 { font-size: clamp(24px, 4vw, 36px); letter-spacing: -1px; margin: 0 0 12px; font-weight: 900; }
      #loading-label { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; margin: 0 0 20px; }
      .progress-row { display: flex; align-items: center; gap: 14px; }
      progress { display: block; flex: 1; min-width: 0; width: 100%; height: 22px; border: 2px solid; background: #f7f5ee; border-radius: 0; appearance: none; }
      progress::-webkit-progress-bar { background: #f7f5ee; }
      progress::-webkit-progress-value { background: var(--accent); }
      progress::-moz-progress-bar { background: var(--accent); }
      #percent { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
      #retry { padding: 10px 18px; border: 3px solid; background: var(--accent); box-shadow: 3px 3px 0; font: bold 16px 'Montserrat', sans-serif; cursor: pointer; }
      #retry:focus-visible { outline: 3px solid #3157ff; outline-offset: 5px; }
      #warning { position: fixed; top: 12px; left: 12px; right: 12px; pointer-events: none; }
      #warning div { padding: 12px; border: 3px solid; background: #ffe24b; font-size: 14px; margin-bottom: 8px; }
      @media (max-height: 420px) { .card { padding: 18px; } .sticker { width: 42px; height: 42px; font-size: 30px; margin-bottom: 12px; } h2 { font-size: 24px; } }
    `;
    const games = {
      portfolio: { label: 'PORTFOLIO / PLAYABLE', note: 'Explore the interactive portfolio.', title: 'Portfolio', color: '#ffe24b', glyph: '?' },
      slotmachine: { label: 'SLOT MACHINE / PLAYABLE', note: 'Play the Slot Machine demo.', title: 'Slot Machine', color: '#ff8dc7', glyph: '7' }
    };
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panel = document.getElementById('player-panel');
    const space = document.getElementById('player-space');
    const fontStylesheet = document.getElementById('montserrat-font').outerHTML;
    let activeGame;
    let frame;

    function selectGame(game, force = false) {
      if (!games[game] || (activeGame === game && !force)) return;
      activeGame = game;
      const experience = games[game];
      document.body.dataset.game = game;
      document.title = "Who's that developer? | " + experience.title;
      document.getElementById('experience-label').textContent = experience.label;
      document.getElementById('experience-note').textContent = experience.note;
      panel.setAttribute('aria-labelledby', 'tab-' + game);
      tabs.forEach(tab => {
        const selected = tab.dataset.game === game;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      const base = document.createElement('base');
      base.href = new URL('.', window.location.href).href;
      const nextFrame = document.createElement('iframe');
      nextFrame.title = experience.title + ' player';
      nextFrame.allow = 'fullscreen; autoplay';
      nextFrame.srcdoc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">${base.outerHTML}${fontStylesheet}<style>:root { --accent: ${experience.color}; }${playerStyles}</style></head><body>
        <canvas id="unity-canvas" tabindex="0"></canvas>
        <div id="loading"><div class="card"><div class="sticker" aria-hidden="true">${experience.glyph}</div><h2 id="loading-title">${experience.title}</h2><p id="loading-label" role="status">Loading ${experience.title}...</p><div class="progress-row"><progress id="progress" max="100" value="0" aria-label="Loading progress"></progress><span id="percent">0%</span></div><button id="retry" type="button" hidden>Try again</button></div></div>
        <div id="warning" role="alert"></div><script>(${runPlayer.toString()})(${JSON.stringify(game)});<\/script></body></html>`;
      space.replaceChildren(nextFrame);
      frame = nextFrame;
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectGame(tab.dataset.game));
      tab.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = tabs.length - 1;
        else return;
        event.preventDefault();
        selectGame(tabs[next].dataset.game);
        tabs[next].focus();
      });
    });
    window.addEventListener('message', event => {
      if (frame && event.source === frame.contentWindow && event.origin === window.location.origin && event.data?.type === 'retry-player') selectGame(activeGame, true);
    });
    const fullscreen = document.getElementById('fullscreen');
    const workspace = document.getElementById('workspace');
    fullscreen.hidden = !document.fullscreenEnabled;
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await workspace.requestFullscreen();
      } catch (error) { console.warn('Fullscreen is unavailable:', error); }
    });
    document.addEventListener('fullscreenchange', () => {
      const enabled = Boolean(document.fullscreenElement);
      fullscreen.setAttribute('aria-pressed', String(enabled));
      fullscreen.setAttribute('aria-label', enabled ? 'Exit fullscreen' : 'Enter fullscreen');
      document.getElementById('fullscreen-label').textContent = enabled ? 'Exit fullscreen' : 'Fullscreen';
    });
    document.getElementById('year').textContent = new Date().getFullYear();
    selectGame('portfolio');
  </script>
</body>
</html>
